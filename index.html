<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PG Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-200 flex items-center justify-center h-screen font-sans">

    <div class="bg-white p-8 rounded-lg shadow-lg w-96 max-w-full">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-blue-700">PG Manager</h1>
            <p class="text-gray-500 text-sm">Enter PIN to access your dashboard</p>
        </div>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Access PIN</label>
                <input type="password" id="pin-input" required class="mt-1 w-full p-3 border border-gray-300 rounded-md text-center text-xl tracking-widest" placeholder="••••">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded-md hover:bg-blue-700 font-bold">Login</button>
        </form>
        <p id="login-error" class="text-red-500 text-sm text-center mt-3 hidden">Incorrect PIN.</p>
    </div>

    <script src="app.js"></script>
</body>
</html>
