<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenants - PG Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">
    <div id="navbar-placeholder"></div>

    <main class="container mx-auto mt-8 p-4 grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Add Tenant Form -->
        <div class="bg-white p-6 rounded-lg shadow-md col-span-1 h-fit">
            <h2 class="text-xl font-semibold mb-4">Add New Tenant</h2>
            <form id="add-tenant-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Full Name</label>
                    <input type="text" id="t-name" required class="mt-1 w-full p-2 border border-gray-300 rounded-md">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Phone Number</label>
                    <input type="text" id="t-phone" required class="mt-1 w-full p-2 border border-gray-300 rounded-md">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Aadhar Number</label>
                    <input type="text" id="t-aadhar" required class="mt-1 w-full p-2 border border-gray-300 rounded-md">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Joining Date</label>
                    <input type="date" id="t-date" required class="mt-1 w-full p-2 border border-gray-300 rounded-md">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Assign Room</label>
                    <select id="t-room" required class="mt-1 w-full p-2 border border-gray-300 rounded-md">
                        <option value="" disabled selected>Loading available rooms...</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded-md hover:bg-blue-700">Save Tenant</button>
            </form>
        </div>

        
        <!-- Tenant List -->
        <div class="bg-white p-6 rounded-lg shadow-md col-span-2">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-4">
                <h2 class="text-xl font-semibold">Active Tenants</h2>
                <!-- New Search Bar -->
                <div class="relative w-full sm:w-64">
                    <input type="text" id="tenant-search" placeholder="Search by name, phone, or room..." 
                           class="w-full pl-8 pr-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500">
                    <svg class="w-4 h-4 text-gray-500 absolute left-2.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
            </div>
            
            <div class="overflow-x-auto">
                <table class="min-w-full text-left text-sm" id="tenant-table">
                    <thead class="bg-gray-200">
                        <tr>
                            <th class="p-3 border-b">Name & Status</th>
                            <th class="p-3 border-b">Room</th>
                            <th class="p-3 border-b text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tenant-table-body">
                        <tr><td colspan="3" class="p-3 text-gray-500 text-center">Loading tenants...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
