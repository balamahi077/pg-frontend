<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PG Management Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">
    <div id="navbar-placeholder"></div>

    <!-- Main Content Area -->
    <main class="container mx-auto mt-8 p-4">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
            <h2 class="text-2xl font-bold text-gray-800">Live Occupancy Dashboard</h2>
            
            <!-- Room Search Bar -->
            <div class="relative w-full sm:w-72">
                <input type="text" id="room-search" placeholder="Search by block or room no..." 
                       class="w-full pl-8 pr-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <svg class="w-4 h-4 text-gray-500 absolute left-2.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>
        </div>

        <div id="room-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <p class="text-gray-500 col-span-full">Loading rooms...</p>
        </div>

        <!-- Room Occupants Modal (Hidden by default) -->
        <div id="room-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50 p-4">
            <div class="bg-white p-6 rounded-lg shadow-xl w-full max-w-md relative">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h2 id="modal-room-title" class="text-xl font-bold text-blue-700">Room Details</h2>
                    <button onclick="closeRoomModal()" class="text-gray-400 hover:text-red-500 font-bold text-2xl">&times;</button>
                </div>
                <div id="modal-room-content" class="space-y-3 max-h-96 overflow-y-auto">
                    <!-- Tenant details will be injected here by JavaScript -->
                </div>
            </div>
        </div>
    </main>

    <!-- Link to our JavaScript file -->
    <script src="app.js"></script>
</body>
</html>
