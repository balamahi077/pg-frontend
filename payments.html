<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payments - PG Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">
    
    <!-- Dynamic Navigation Bar -->
    <div id="navbar-placeholder" class="print:hidden"></div>

    <main class="container mx-auto mt-8 p-4 grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Payment Entry Form (Hidden during PDF print) -->
        <div class="bg-white p-6 rounded-lg shadow-md border-t-4 border-green-500 h-fit print:hidden">
            <h2 class="text-xl font-semibold mb-4 text-green-700">Record Manual Payment</h2>
            
            <form id="record-payment-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Select Customer</label>
                    <select id="p-tenant" required class="mt-1 w-full p-2 border border-gray-300 rounded-md bg-white">
                        <option value="" disabled selected>Loading active customers...</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700">Month & Year of Rent</label>
                    <div class="flex gap-2 mt-1">
                        <select id="p-month" required class="w-full p-2 border border-gray-300 rounded-md bg-white">
                            <option value="" disabled selected>Select Month...</option>
                            <option value="January">January</option>
                            <option value="February">February</option>
                            <option value="March">March</option>
                            <option value="April">April</option>
                            <option value="May">May</option>
                            <option value="June">June</option>
                            <option value="July">July</option>
                            <option value="August">August</option>
                            <option value="September">September</option>
                            <option value="October">October</option>
                            <option value="November">November</option>
                            <option value="December">December</option>
                        </select>
                        
                        <!-- NEW: Year Dropdown -->
                        <select id="p-year" required class="w-1/3 p-2 border border-gray-300 rounded-md bg-white">
                            <option value="2026" selected>2026</option>
                            <option value="2027">2027</option>
                            <option value="2028">2028</option>
                            <option value="2029">2029</option>
                            <option value="2030">2030</option>
                        </select>
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700">Amount Paid (₹)</label>
                    <input type="number" id="p-amount" required class="mt-1 w-full p-2 border border-gray-300 rounded-md">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700">Payment Mode</label>
                    <select id="p-mode" class="mt-1 w-full p-2 border border-gray-300 rounded-md">
                        <option value="CASH">Cash</option>
                        <option value="UPI">UPI</option>
                        <option value="BANK_TRANSFER">Bank Transfer</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700">Reference Note (Optional)</label>
                    <input type="text" id="p-ref" placeholder="UPI UTR last 4 digits" class="mt-1 w-full p-2 border border-gray-300 rounded-md">
                </div>
                
                <button type="submit" class="w-full bg-green-600 text-white p-2 rounded-md hover:bg-green-700 font-bold mt-4">Verify & Record</button>
            </form>
        </div>

        <!-- Payment History Table -->
        <div class="bg-white p-6 rounded-lg shadow-md col-span-2">
            
            <!-- Filter & Search Controls (Hidden during PDF print) -->
            <div class="flex flex-col xl:flex-row justify-between items-start xl:items-center mb-4 gap-4 print:hidden">
                <h2 class="text-xl font-semibold">Recent Collections</h2>
                
                <div class="flex flex-wrap items-center gap-3 w-full xl:w-auto">
                    <!-- Custom Date Range -->
                    <div class="flex items-center space-x-2 bg-gray-50 p-1 rounded-md border border-gray-200">
                        <input type="date" id="filter-from-date" class="p-1.5 border border-gray-300 rounded text-sm focus:ring-green-500 focus:outline-none">
                        <span class="text-gray-500 text-sm">to</span>
                        <input type="date" id="filter-to-date" class="p-1.5 border border-gray-300 rounded text-sm focus:ring-green-500 focus:outline-none">
                    </div>

                    <!-- Month Filter -->
                    <select id="filter-payment-month" class="p-2 border border-gray-300 rounded-md shadow-sm text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
                        <option value="ALL">All Months</option>
                        <option value="January">January</option>
                        <option value="February">February</option>
                        <option value="March">March</option>
                        <option value="April">April</option>
                        <option value="May">May</option>
                        <option value="June">June</option>
                        <option value="July">July</option>
                        <option value="August">August</option>
                        <option value="September">September</option>
                        <option value="October">October</option>
                        <option value="November">November</option>
                        <option value="December">December</option>
                    </select>
                    
                    <!-- Text Search -->
                    <div class="relative w-48">
                        <input type="text" id="search-payment" placeholder="Search name..." 
                               class="w-full pl-8 pr-3 py-2 border border-gray-300 rounded-md text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-green-500">
                        <svg class="w-4 h-4 text-gray-500 absolute left-2.5 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>

                    <!-- Dynamic Print Button (Hidden by default) -->
                    <button id="print-pdf-btn" onclick="window.print()" class="hidden bg-red-600 text-white px-4 py-2 rounded-md font-bold text-sm shadow-sm hover:bg-red-700 flex items-center">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                        PDF
                    </button>
                </div>
            </div>
            
            <div class="overflow-x-auto">
                <table class="min-w-full text-left text-sm" id="payments-table">
                    <thead class="bg-gray-200">
                        <tr>
                            <th class="p-3 border-b">Date</th>
                            <th class="p-3 border-b">Customer & Room</th>
                            <th class="p-3 border-b">Month of Rent</th>
                            <th class="p-3 border-b text-right">Amount</th>
                            <!-- Removed print:hidden from Mode -->
                            <th class="p-3 border-b text-center">Mode</th> 
                            <th class="p-3 border-b text-center print:hidden">Ref</th>
                        </tr>
                    </thead>
                    <tbody id="payment-table-body">
                        <tr><td colspan="6" class="p-3 text-center text-gray-500">Loading payments...</td></tr>
                    </tbody>
                    <!-- NEW: Footer to show dynamic totals -->
                    <tfoot class="bg-green-50 border-t-2 border-green-200">
                        <tr>
                            <td colspan="3" class="p-3 text-right font-bold text-gray-700">Total for selected period:</td>
                            <td id="filtered-total-amount" class="p-3 text-right font-bold text-green-700 text-lg">₹0</td>
                            <td colspan="2" class="p-3"></td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </main>

    <!-- Reference Note Modal (Hidden by default, hidden on print) -->
    <div id="ref-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50 p-4 print:hidden">
        <div class="bg-white p-6 rounded-lg shadow-xl w-full max-w-sm relative">
            <h2 class="text-lg font-bold mb-4 text-gray-800">Reference Note</h2>
            <p id="ref-modal-text" class="text-gray-700 mb-6 bg-gray-50 p-4 rounded border whitespace-pre-wrap"></p>
            <div class="flex justify-end">
                <button onclick="closeRefModal()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Close</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
